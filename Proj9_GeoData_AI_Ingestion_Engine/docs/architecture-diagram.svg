<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Directory ETL Pipeline architecture diagram</title>
<desc id="desc">businesses.json to a Playwright Google Maps scraper, Gemini writes each listing, a place_id lookup decides create or update, the photo is vetted, and one request saves the directory_listing post in WordPress.</desc>
<defs>
<style>

      text { font-family: "Segoe UI", Arial, sans-serif; fill: #18324a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5c7289; }
      .section { font-size: 14px; font-weight: 700; fill: #2f5d88; letter-spacing: 0.06em; }
      .node-title { font-weight: 700; }
      .node-body { fill: #567089; }
      .main-node { fill: #ffffff; stroke: #4c86b8; stroke-width: 2.5; }
      .support-node { fill: #f4f8fc; stroke: #92b4d3; stroke-width: 2; }
      .band { fill: #eef6fc; stroke: #d7e5f1; stroke-width: 2; }
      .arrow { stroke: #2f6ea5; stroke-width: 3.5; fill: none; }
      .up-arrow { stroke: #6f8fb0; stroke-width: 2.5; fill: none; }
      .label { font-size: 12px; fill: #456684; }
      .note { font-size: 13px; fill: #4f6780; }
      .note-strong { font-size: 13px; font-weight: 700; fill: #2f5d88; }

</style>
<marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#2f6ea5"/></marker>
<marker id="head-sup" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#6f8fb0"/></marker>
</defs>
<rect width="1600" height="900" fill="#edf4fb"/>
<rect x="34" y="28" width="1532" height="844" rx="34" fill="#ffffff" stroke="#d9e6f2" stroke-width="2"/>
<text class="title" x="68" y="88">Directory ETL Pipeline</text>
<text class="subtitle" x="68" y="116">Businesses found on Google Maps, written up by Gemini, saved to WordPress, updated in place on every re-run</text>
<rect class="band" x="70" y="160" width="1460" height="250" rx="30"/>
<text class="section" x="96" y="196">MAIN FLOW</text>
<rect class="band" x="70" y="530" width="1460" height="188" rx="30"/>
<text class="section" x="96" y="564">SUPPORTING</text>
<rect class="main-node" x="96" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="187" y="300" text-anchor="middle" font-size="17">businesses.json</text>
<text class="node-body" x="187" y="324" text-anchor="middle" font-size="13">names and city</text>
<text class="node-body" x="187" y="342" text-anchor="middle" font-size="13">to look up</text>
<rect class="main-node" x="341" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="432" y="300" text-anchor="middle" font-size="17">scraper.py</text>
<text class="node-body" x="432" y="324" text-anchor="middle" font-size="13">Playwright on Maps:</text>
<text class="node-body" x="432" y="342" text-anchor="middle" font-size="13">name, address, photo</text>
<rect class="main-node" x="587" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="677" y="298" text-anchor="middle" font-size="15.0">pipeline_processor</text>
<text class="node-body" x="677" y="322" text-anchor="middle" font-size="13">listing text by Gemini</text>
<text class="node-body" x="677" y="340" text-anchor="middle" font-size="13">id: md5(name+address)</text>
<rect class="main-node" x="832" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="923" y="300" text-anchor="middle" font-size="17">wp_importer.py</text>
<text class="node-body" x="923" y="324" text-anchor="middle" font-size="13">GET ?place_id= decides</text>
<text class="node-body" x="923" y="342" text-anchor="middle" font-size="13">create or update</text>
<rect class="main-node" x="1077" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="1168" y="300" text-anchor="middle" font-size="17">Photo + gallery</text>
<text class="node-body" x="1168" y="324" text-anchor="middle" font-size="13">vet photo, redo it if</text>
<text class="node-body" x="1168" y="342" text-anchor="middle" font-size="13">under 1200px wide</text>
<rect class="main-node" x="1323" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="1413" y="300" text-anchor="middle" font-size="17">WordPress</text>
<text class="node-body" x="1413" y="324" text-anchor="middle" font-size="13">directory_listing post,</text>
<text class="node-body" x="1413" y="342" text-anchor="middle" font-size="13">one create or update</text>
<line class="arrow" x1="279" y1="312" x2="337" y2="312" marker-end="url(#head)"/>
<text class="label" x="309" y="302" text-anchor="middle">read</text>
<line class="arrow" x1="525" y1="312" x2="583" y2="312" marker-end="url(#head)"/>
<text class="label" x="555" y="302" text-anchor="middle">scrape</text>
<line class="arrow" x1="770" y1="312" x2="828" y2="312" marker-end="url(#head)"/>
<text class="label" x="800" y="302" text-anchor="middle">look up</text>
<line class="arrow" x1="1015" y1="312" x2="1073" y2="312" marker-end="url(#head)"/>
<text class="label" x="1045" y="302" text-anchor="middle">new only</text>
<line class="arrow" x1="1261" y1="312" x2="1319" y2="312" marker-end="url(#head)"/>
<text class="label" x="1291" y="302" text-anchor="middle">save</text>
<rect class="support-node" x="587" y="590" width="181" height="104" rx="20"/>
<text class="node-title" x="677" y="630" text-anchor="middle" font-size="17">Gemini text</text>
<text class="node-body" x="677" y="654" text-anchor="middle" font-size="13">two paragraphs, no</text>
<text class="node-body" x="677" y="672" text-anchor="middle" font-size="13">invented prices</text>
<line class="up-arrow" x1="677" y1="586" x2="677" y2="378" marker-end="url(#head-sup)"/>
<text class="label" x="687" y="486" font-size="12">writes</text>
<rect class="support-node" x="1077" y="590" width="181" height="104" rx="20"/>
<text class="node-title" x="1168" y="630" text-anchor="middle" font-size="17">Gemini vision</text>
<text class="node-body" x="1168" y="654" text-anchor="middle" font-size="13">rejects menus, crowds;</text>
<text class="node-body" x="1168" y="672" text-anchor="middle" font-size="13">draws the gallery</text>
<line class="up-arrow" x1="1168" y1="586" x2="1168" y2="378" marker-end="url(#head-sup)"/>
<text class="label" x="1178" y="486" font-size="12">vets, generates</text>
<rect class="support-node" x="1323" y="590" width="181" height="104" rx="20"/>
<text class="node-title" x="1413" y="630" text-anchor="middle" font-size="17">WP plugin 1.1.0</text>
<text class="node-body" x="1413" y="654" text-anchor="middle" font-size="13">post type, meta,</text>
<text class="node-body" x="1413" y="672" text-anchor="middle" font-size="13">?place_id= filter</text>
<line class="up-arrow" x1="1413" y1="586" x2="1413" y2="378" marker-end="url(#head-sup)"/>
<text class="label" x="1423" y="486" font-size="12">registers</text>
<text x="70" y="770"><tspan class="note-strong">Idempotent:</tspan><tspan class="note" dx="8">a re-run finds each listing by place_id and updates it, reusing the photo instead of uploading it again.</tspan></text>
<text x="70" y="796"><tspan class="note-strong">Verified 2026-09-27:</tspan><tspan class="note" dx="8">live WordPress site, run 1 created 3 listings, run 2 updated the same 3, still exactly 3.</tspan></text>
<text x="70" y="822"><tspan class="note-strong">Resilient:</tspan><tspan class="note" dx="8">one business failing is recorded in the report and the batch carries on; every call has a timeout.</tspan></text>
</svg>

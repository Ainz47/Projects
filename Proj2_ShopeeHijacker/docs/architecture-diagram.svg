<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Proj2 Shopee Hijacker Architecture Diagram</title>
  <desc id="desc">Simplified architecture diagram for the Shopee CDP interception pipeline showing authenticated Chrome, Playwright CDP attachment, passive API interception, CSV export, and optional SQLite loading.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #18324a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5c7289; }
      .section { font-size: 14px; font-weight: 700; fill: #2f5d88; letter-spacing: 0.06em; }
      .node-title { font-size: 17px; font-weight: 700; }
      .node-body { font-size: 13px; fill: #567089; }
      .main-node { fill: #ffffff; stroke: #4c86b8; stroke-width: 2.5; rx: 22; }
      .support-node { fill: #f4f8fc; stroke: #92b4d3; stroke-width: 2; rx: 20; }
      .band { fill: #eef6fc; stroke: #d7e5f1; stroke-width: 2; rx: 30; }
      .arrow { stroke: #2f6ea5; stroke-width: 4; fill: none; }
      .label { font-size: 12px; fill: #456684; }
      .note { font-size: 12px; fill: #6a7f95; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#2f6ea5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="900" fill="#edf5fb"/>
  <rect x="34" y="28" width="1532" height="844" rx="32" fill="#ffffff" stroke="#d8e5f0" stroke-width="2"/>

  <text x="68" y="82" class="title">Proj2 Shopee Hijacker</text>
  <text x="68" y="112" class="subtitle">A simplified view of the live browser hijack, passive interception, and export flow</text>

  <rect x="70" y="170" width="1460" height="330" class="band"/>
  <text x="96" y="205" class="section">CORE DATA FLOW</text>

  <rect x="100" y="270" width="220" height="110" class="main-node"/>
  <text x="210" y="304" text-anchor="middle" class="node-title">Authenticated Chrome</text>
  <text x="210" y="330" text-anchor="middle" class="node-body">manual login + solved CAPTCHA</text>
  <text x="210" y="352" text-anchor="middle" class="node-body">remote debugging enabled</text>

  <rect x="390" y="270" width="200" height="110" class="main-node"/>
  <text x="490" y="304" text-anchor="middle" class="node-title">Playwright via CDP</text>
  <text x="490" y="330" text-anchor="middle" class="node-body">attach to live browser</text>
  <text x="490" y="352" text-anchor="middle" class="node-body">reuse session state</text>

  <rect x="660" y="270" width="210" height="110" class="main-node"/>
  <text x="765" y="304" text-anchor="middle" class="node-title">Passive Interceptor</text>
  <text x="765" y="330" text-anchor="middle" class="node-body">listen for search API</text>
  <text x="765" y="352" text-anchor="middle" class="node-body">capture raw JSON responses</text>

  <rect x="940" y="270" width="190" height="110" class="main-node"/>
  <text x="1035" y="304" text-anchor="middle" class="node-title">Pandas Cleanup</text>
  <text x="1035" y="330" text-anchor="middle" class="node-body">deduplicate products</text>
  <text x="1035" y="352" text-anchor="middle" class="node-body">normalize export rows</text>

  <rect x="1200" y="270" width="150" height="110" class="main-node"/>
  <text x="1275" y="314" text-anchor="middle" class="node-title">CSV Export</text>
  <text x="1275" y="340" text-anchor="middle" class="node-body">product dataset</text>

  <rect x="1420" y="270" width="90" height="110" class="main-node"/>
  <text x="1465" y="304" text-anchor="middle" class="node-title">SQLite</text>
  <text x="1465" y="330" text-anchor="middle" class="node-body">optional</text>
  <text x="1465" y="352" text-anchor="middle" class="node-body">load</text>

  <path d="M 320 325 L 390 325" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 590 325 L 660 325" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 870 325 L 940 325" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 1130 325 L 1200 325" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 1350 325 L 1420 325" class="arrow" marker-end="url(#arrowhead)"/>

  <text x="355" y="304" text-anchor="middle" class="label">attach</text>
  <text x="625" y="304" text-anchor="middle" class="label">listen</text>
  <text x="905" y="304" text-anchor="middle" class="label">clean</text>
  <text x="1165" y="304" text-anchor="middle" class="label">write</text>
  <text x="1385" y="304" text-anchor="middle" class="label">ingest</text>

  <rect x="70" y="545" width="1460" height="250" class="band"/>
  <text x="96" y="580" class="section">SUPPORTING COMPONENTS</text>

  <rect x="220" y="628" width="220" height="92" class="support-node"/>
  <text x="330" y="662" text-anchor="middle" class="node-title">Engineer</text>
  <text x="330" y="688" text-anchor="middle" class="node-body">opens Chrome and guides session</text>

  <rect x="560" y="628" width="260" height="92" class="support-node"/>
  <text x="690" y="662" text-anchor="middle" class="node-title">Shopee Search Pages</text>
  <text x="690" y="688" text-anchor="middle" class="node-body">lazy-loaded results trigger API traffic</text>

  <rect x="980" y="628" width="240" height="92" class="support-node"/>
  <text x="1100" y="662" text-anchor="middle" class="node-title">Search API Responses</text>
  <text x="1100" y="688" text-anchor="middle" class="node-body">exact prices and sold counts</text>

  <rect x="1320" y="628" width="170" height="92" class="support-node"/>
  <text x="1405" y="662" text-anchor="middle" class="node-title">market_intelligence.db</text>
  <text x="1405" y="688" text-anchor="middle" class="node-body">analysis store</text>

  <path d="M 330 628 L 210 380" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 690 628 L 765 380" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 1100 628 L 765 380" class="arrow" marker-end="url(#arrowhead)"/>
  <path d="M 1405 628 L 1465 380" class="arrow" marker-end="url(#arrowhead)"/>

  <text x="256" y="514" class="label">manual auth</text>
  <text x="676" y="514" class="label">page traffic</text>
  <text x="968" y="514" class="label">raw backend data</text>
  <text x="1382" y="514" class="label">local storage</text>

  <text x="70" y="835" class="note">This version focuses on the main interception path and keeps the session-hijack details lightweight so the diagram stays easy to scan.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Shopee Search Capture architecture diagram</title>
<desc id="desc">shopee_capture.py attaches to a logged-in Chrome over CDP, pages through a search, listens to the search API responses, parses and dedupes them, and appends each run to SQLite and a CSV.</desc>
<defs>
<style>

      text { font-family: "Segoe UI", Arial, sans-serif; fill: #18324a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5c7289; }
      .section { font-size: 14px; font-weight: 700; fill: #2f5d88; letter-spacing: 0.06em; }
      .node-title { font-weight: 700; }
      .node-body { fill: #567089; }
      .main-node { fill: #ffffff; stroke: #4c86b8; stroke-width: 2.5; }
      .support-node { fill: #f4f8fc; stroke: #92b4d3; stroke-width: 2; }
      .band { fill: #eef6fc; stroke: #d7e5f1; stroke-width: 2; }
      .arrow { stroke: #2f6ea5; stroke-width: 3.5; fill: none; }
      .up-arrow { stroke: #6f8fb0; stroke-width: 2.5; fill: none; }
      .label { font-size: 12px; fill: #456684; }
      .note { font-size: 13px; fill: #4f6780; }
      .note-strong { font-size: 13px; font-weight: 700; fill: #2f5d88; }

</style>
<marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#2f6ea5"/></marker>
<marker id="head-sup" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#6f8fb0"/></marker>
</defs>
<rect width="1600" height="900" fill="#edf4fb"/>
<rect x="34" y="28" width="1532" height="844" rx="34" fill="#ffffff" stroke="#d9e6f2" stroke-width="2"/>
<text class="title" x="68" y="88">Shopee Search Capture</text>
<text class="subtitle" x="68" y="116">Search results read from the page&#x27;s own API responses in your logged-in Chrome, kept per run in SQLite</text>
<rect class="band" x="70" y="160" width="1460" height="250" rx="30"/>
<text class="section" x="96" y="196">MAIN FLOW</text>
<rect class="band" x="70" y="530" width="1460" height="188" rx="30"/>
<text class="section" x="203" y="564">SUPPORTING</text>
<rect class="main-node" x="96" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="187" y="300" text-anchor="middle" font-size="17">Your Chrome</text>
<text class="node-body" x="187" y="324" text-anchor="middle" font-size="13">logged in to shopee.ph,</text>
<text class="node-body" x="187" y="342" text-anchor="middle" font-size="13">remote debugging on</text>
<rect class="main-node" x="341" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="432" y="299" text-anchor="middle" font-size="16.0">shopee_capture.py</text>
<text class="node-body" x="432" y="323" text-anchor="middle" font-size="13">attach over CDP,</text>
<text class="node-body" x="432" y="341" text-anchor="middle" font-size="13">open its own tab</text>
<rect class="main-node" x="587" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="677" y="300" text-anchor="middle" font-size="17">Search pages</text>
<text class="node-body" x="677" y="324" text-anchor="middle" font-size="13">page=0, 1, 2 ...</text>
<text class="node-body" x="677" y="342" text-anchor="middle" font-size="13">stops on a login page</text>
<rect class="main-node" x="832" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="923" y="300" text-anchor="middle" font-size="17">API responses</text>
<text class="node-body" x="923" y="324" text-anchor="middle" font-size="13">the page&#x27;s own calls,</text>
<text class="node-body" x="923" y="342" text-anchor="middle" font-size="13">only listened to</text>
<rect class="main-node" x="1077" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="1168" y="300" text-anchor="middle" font-size="17">shopee.py</text>
<text class="node-body" x="1168" y="324" text-anchor="middle" font-size="13">parse, dedupe on</text>
<text class="node-body" x="1168" y="342" text-anchor="middle" font-size="13">(shop ID, item ID)</text>
<rect class="main-node" x="1323" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="1413" y="300" text-anchor="middle" font-size="17">storage.py</text>
<text class="node-body" x="1413" y="324" text-anchor="middle" font-size="13">SQLite: run + products</text>
<text class="node-body" x="1413" y="342" text-anchor="middle" font-size="13">in one transaction</text>
<line class="arrow" x1="279" y1="312" x2="337" y2="312" marker-end="url(#head)"/>
<text class="label" x="309" y="302" text-anchor="middle">attach</text>
<line class="arrow" x1="525" y1="312" x2="583" y2="312" marker-end="url(#head)"/>
<text class="label" x="555" y="302" text-anchor="middle">navigate</text>
<line class="arrow" x1="770" y1="312" x2="828" y2="312" marker-end="url(#head)"/>
<text class="label" x="800" y="302" text-anchor="middle">loads</text>
<line class="arrow" x1="1015" y1="312" x2="1073" y2="312" marker-end="url(#head)"/>
<text class="label" x="1045" y="302" text-anchor="middle">parse</text>
<line class="arrow" x1="1261" y1="312" x2="1319" y2="312" marker-end="url(#head)"/>
<text class="label" x="1291" y="302" text-anchor="middle">save</text>
<rect class="support-node" x="96" y="590" width="181" height="104" rx="20"/>
<text class="node-title" x="187" y="630" text-anchor="middle" font-size="17">You</text>
<text class="node-body" x="187" y="654" text-anchor="middle" font-size="13">start Chrome and</text>
<text class="node-body" x="187" y="672" text-anchor="middle" font-size="13">log in once</text>
<line class="up-arrow" x1="187" y1="586" x2="187" y2="378" marker-end="url(#head-sup)"/>
<text class="label" x="197" y="486" font-size="12">logs in</text>
<rect class="support-node" x="1077" y="590" width="181" height="104" rx="20"/>
<text class="node-title" x="1168" y="630" text-anchor="middle" font-size="17">Failure count</text>
<text class="node-body" x="1168" y="654" text-anchor="middle" font-size="13">bad JSON, missing IDs:</text>
<text class="node-body" x="1168" y="672" text-anchor="middle" font-size="13">counted and reported</text>
<line class="up-arrow" x1="1168" y1="378" x2="1168" y2="586" marker-end="url(#head-sup)"/>
<text class="label" x="1178" y="486" font-size="12">counts</text>
<rect class="support-node" x="1323" y="590" width="181" height="104" rx="20"/>
<text class="node-title" x="1413" y="630" text-anchor="middle" font-size="17">CSV</text>
<text class="node-body" x="1413" y="654" text-anchor="middle" font-size="13">one file per run,</text>
<text class="node-body" x="1413" y="672" text-anchor="middle" font-size="13">under runs/</text>
<line class="up-arrow" x1="1413" y1="378" x2="1413" y2="586" marker-end="url(#head-sup)"/>
<text class="label" x="1423" y="486" font-size="12">also writes</text>
<text x="70" y="770"><tspan class="note-strong">No scripted requests:</tspan><tspan class="note" dx="8">it reads the traffic the page makes anyway, in its own tab, and never touches your other tabs.</tspan></text>
<text x="70" y="796"><tspan class="note-strong">History:</tspan><tspan class="note" dx="8">runs are appended, never replaced, so an item&#x27;s price and sales can be compared across days.</tspan></text>
</svg>

name: tests

# Runs the projects that ship tests. Windows runner on purpose: the hook
# tests use Windows-style project paths and the suites were verified on Windows.
on:
  push:
  pull_request:

jobs:
  proj14-schedule-pwa:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Proj14_Personal_Workflow_PWA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - run: python -X utf8 -m unittest discover -s tests -p "test_*.py"

  proj15-claude-code-tooling:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Proj15_Claude_Code_Tooling/hooks
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - name: Run each test script
        run: for f in test_*.py; do python -X utf8 "$f" || exit 1; done

  proj16-n8n-lead-capture:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Proj16_n8n_Lead_Capture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: node --test "tests/*.test.js"
      - run: python -X utf8 -m unittest discover -s tests -p "test_*.py"

  proj17-email-deliverability:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Proj17_Email_Deliverability_Checker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test "tests/*.test.js"

  proj18-coffee-storefront:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Proj18_Coffee_Storefront
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Proj18_Coffee_Storefront/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The committed page matches the build
        shell: bash
        run: |
          if [ -n "$(git status --porcelain -- ../docs/coffee-store)" ]; then
            echo "docs/coffee-store is out of date: run npm run build and commit the result"
            git status --porcelain -- ../docs/coffee-store
            exit 1
          fi

  proj19-stock-sync:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Proj19_Shopify_Stock_Sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: node --test "tests/*.test.js"
      - run: python -X utf8 -m unittest discover -s tests -p "test_*.py"

  proj20-ghl-lead-router:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Proj20_GHL_Lead_Router
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: cd backend && python -m pip install -r requirements.txt
      - run: cd backend && python -X utf8 -m pytest tests -v
      - run: python -X utf8 -m unittest discover -s tests -p "test_*.py"

  proj9-geodata-pipeline:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Proj9_GeoData_AI_Ingestion_Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m pytest tests -v

  proj2-shopee-capture:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Proj2_ShopeeHijacker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install pytest
      - run: python -X utf8 -m pytest tests -v

  proj7-labor-alerts:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Proj7_FastAPI_ETL_Alerts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install -r requirements.txt
      - run: python -X utf8 -m pytest tests -v

  proj8-arxiv-pipeline:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Proj8_Arxiv_Pipeline
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r extraction/requirements.txt pytest dbt-core==1.12.5 dbt-duckdb==1.11.0 duckdb==1.5.5
      - run: python -X utf8 -m pytest tests -v
      - run: python tests/make_fixture.py ci_raw
      - name: dbt build on the fixture, twice (full load, then incremental)
        working-directory: Proj8_Arxiv_Pipeline/transformation/arxiv_transform
        run: |
          dbt build --profiles-dir . --vars '{raw_path: "../../ci_raw/*.parquet"}'
          dbt build --profiles-dir . --vars '{raw_path: "../../ci_raw/*.parquet"}'

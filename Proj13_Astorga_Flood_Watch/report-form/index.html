<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Report Flooding — Astorga Central</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M16 3C10 12 7 16 7 21a9 9 0 0 0 18 0c0-5-3-9-9-18z' fill='%233bc9db'/></svg>" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f1720; --panel: #182432; --line: #2a3b4e;
      --water: #3bc9db; --watch: #f4b740; --text: #e6edf3; --muted: #8b9baa;
      --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); line-height: 1.5; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 20px 18px 60px; }
    header { padding: 6px 0 18px; display: flex; align-items: center; gap: 10px; }
    header .seal { width: 32px; height: 32px; border-radius: 50%; object-fit: cover;
      background: #fff; box-shadow: 0 0 0 1px var(--line); }
    .mark { font-weight: 700; font-size: 17px; letter-spacing: 0.5px; }
    .mark .accent { color: var(--water); }
    h1 { font-size: 24px; margin: 18px 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
    label { display: block; font-family: var(--mono); font-size: 11px; text-transform: uppercase;
            letter-spacing: 1px; color: var(--muted); margin: 18px 0 7px; }
    textarea, input[type=text] {
      width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
      color: var(--text); font-family: var(--sans); font-size: 15px; padding: 11px 12px; resize: vertical;
    }
    textarea:focus, input:focus { outline: none; border-color: var(--water); }
    #map { height: 300px; border-radius: 10px; margin-top: 7px; border: 1px solid var(--line); }
    .coords { font-family: var(--mono); font-size: 12px; color: var(--muted); margin-top: 8px; }
    .gps {
      display: inline-flex; align-items: center; gap: 8px; margin-top: 10px;
      background: transparent; border: 1px solid var(--water); color: var(--water);
      font-family: var(--mono); font-size: 13px; padding: 9px 14px; border-radius: 8px; cursor: pointer;
    }
    .gps:active { background: rgba(59,201,219,0.12); }
    .check { display: flex; align-items: flex-start; gap: 10px; margin-top: 20px;
             background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 13px; cursor: pointer; }
    .check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--watch); }
    .check .t { font-size: 14px; }
    .check .t small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    button.submit {
      width: 100%; margin-top: 24px; background: var(--water); color: #062028; border: none;
      font-family: var(--sans); font-weight: 700; font-size: 16px; padding: 15px; border-radius: 10px; cursor: pointer;
    }
    button.submit:disabled { opacity: 0.5; cursor: default; }
    .msg { margin-top: 18px; padding: 13px 15px; border-radius: 8px; font-size: 14px; display: none; }
    .msg.ok { display: block; background: rgba(47,179,128,0.14); border: 1px solid #2fb380; color: #7ee0b4; }
    .msg.err { display: block; background: rgba(228,72,59,0.14); border: 1px solid #e4483b; color: #ffb3ac; }
    .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <img class="seal" src="../assets/astorga-seal.jpg" alt="Official seal of Barangay Astorga" />
      <span class="mark">Astorga<span class="accent">·</span>Central</span>
    </header>

    <h1>Report flooding near you</h1>
    <p class="sub">Tell the barangay what you see. Your report appears on the response team's live map right away.</p>

    <label for="desc">What is happening?</label>
    <textarea id="desc" rows="3" placeholder="e.g. Water rising fast at the creek crossing, knee-deep on the road."></textarea>

    <label>Where is it? Drag the pin to the exact spot.</label>
    <div id="map"></div>
    <div class="coords" id="coords">Pin: 6.91160, 125.46110</div>
    <button type="button" class="gps" id="gps">◎ Use my current location</button>
    <div class="hint" id="gps-hint"></div>

    <label for="photo">Photo link (optional)</label>
    <input type="text" id="photo" placeholder="Paste an image URL if you have one" />

    <label class="check">
      <input type="checkbox" id="monitor" />
      <span class="t">Ask the barangay to monitor this spot
        <small>Flags this location for follow-up even after the water goes down.</small></span>
    </label>

    <button class="submit" id="submit">Send report</button>
    <div class="msg" id="msg"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_BASE = "http://localhost:8000";
    const START = [6.9116, 125.4611];
    let pin = { lat: START[0], lng: START[1] };

    const map = L.map("map").setView(START, 15);
    // OpenStreetMap tiles -- CartoDB's host is DNS-blocked on some networks.
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
    }).addTo(map);

    const marker = L.marker(START, { draggable: true }).addTo(map);
    function setPin(lat, lng) {
      pin = { lat, lng };
      marker.setLatLng([lat, lng]);
      document.getElementById("coords").textContent = `Pin: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }
    marker.on("dragend", () => { const p = marker.getLatLng(); setPin(p.lat, p.lng); });
    map.on("click", (e) => setPin(e.latlng.lat, e.latlng.lng));

    document.getElementById("gps").onclick = () => {
      const hint = document.getElementById("gps-hint");
      if (!navigator.geolocation) { hint.textContent = "Location is not available on this device."; return; }
      hint.textContent = "Finding your location...";
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          setPin(pos.coords.latitude, pos.coords.longitude);
          map.setView([pos.coords.latitude, pos.coords.longitude], 17);
          hint.textContent = "Location set. Drag the pin if it is slightly off.";
        },
        () => { hint.textContent = "Could not get your location. Drag the pin to the spot instead."; }
      );
    };

    const msg = document.getElementById("msg");
    document.getElementById("submit").onclick = async () => {
      const description = document.getElementById("desc").value.trim();
      if (!description) { showMsg("err", "Please describe what is happening first."); return; }
      const btn = document.getElementById("submit");
      btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE}/api/reports`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            service: "flood_watch",
            description,
            photo_url: document.getElementById("photo").value.trim() || null,
            lat: pin.lat, lng: pin.lng,
            request_monitoring: document.getElementById("monitor").checked,
          }),
        });
        if (!res.ok) throw new Error("Server returned " + res.status);
        showMsg("ok", "Report sent. Thank you — the barangay response team can see it now.");
        document.getElementById("desc").value = "";
        document.getElementById("photo").value = "";
        document.getElementById("monitor").checked = false;
      } catch (err) {
        showMsg("err", "Could not send your report. Check your connection and try again.");
      } finally {
        btn.disabled = false;
      }
    };

    function showMsg(kind, text) {
      msg.className = "msg " + kind;
      msg.textContent = text;
      msg.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  </script>
</body>
</html>

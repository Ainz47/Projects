<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Restaurant Labor Alerts architecture diagram</title>
<desc id="desc">Toast POS and 7shifts webhooks into FastAPI, upserted per store-day, a background job computes CPLH and labor percent, claims the alert once and sends it to Discord.</desc>
<defs>
<style>

      text { font-family: "Segoe UI", Arial, sans-serif; fill: #18324a; }
      .title { font-size: 32px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #5c7289; }
      .section { font-size: 14px; font-weight: 700; fill: #2f5d88; letter-spacing: 0.06em; }
      .node-title { font-weight: 700; }
      .node-body { fill: #567089; }
      .main-node { fill: #ffffff; stroke: #4c86b8; stroke-width: 2.5; }
      .support-node { fill: #f4f8fc; stroke: #92b4d3; stroke-width: 2; }
      .band { fill: #eef6fc; stroke: #d7e5f1; stroke-width: 2; }
      .arrow { stroke: #2f6ea5; stroke-width: 3.5; fill: none; }
      .up-arrow { stroke: #6f8fb0; stroke-width: 2.5; fill: none; }
      .label { font-size: 12px; fill: #456684; }
      .note { font-size: 13px; fill: #4f6780; }
      .note-strong { font-size: 13px; font-weight: 700; fill: #2f5d88; }

</style>
<marker id="head" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#2f6ea5"/></marker>
<marker id="head-sup" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="12" refX="13" refY="6" orient="auto"><path d="M0,0 L14,6 L0,12 z" fill="#6f8fb0"/></marker>
</defs>
<rect width="1600" height="900" fill="#edf4fb"/>
<rect x="34" y="28" width="1532" height="844" rx="34" fill="#ffffff" stroke="#d9e6f2" stroke-width="2"/>
<text class="title" x="68" y="88">Restaurant Labor Alerts</text>
<text class="subtitle" x="68" y="116">POS and scheduler webhooks joined per store-day, labor metrics stored, one Discord alert over 25%</text>
<rect class="band" x="70" y="160" width="1460" height="250" rx="30"/>
<text class="section" x="96" y="196">MAIN FLOW</text>
<rect class="band" x="70" y="530" width="1460" height="188" rx="30"/>
<text class="section" x="203" y="564">SUPPORTING</text>
<rect class="main-node" x="96" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="187" y="298" text-anchor="middle" font-size="14.5">Toast POS + 7shifts</text>
<text class="node-body" x="187" y="322" text-anchor="middle" font-size="13">daily sales webhook,</text>
<text class="node-body" x="187" y="340" text-anchor="middle" font-size="13">daily labor webhook</text>
<rect class="main-node" x="341" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="432" y="300" text-anchor="middle" font-size="17">FastAPI webhooks</text>
<text class="node-body" x="432" y="324" text-anchor="middle" font-size="13">secret header check,</text>
<text class="node-body" x="432" y="342" text-anchor="middle" font-size="13">validate, reply 202</text>
<rect class="main-node" x="587" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="677" y="300" text-anchor="middle" font-size="17">Store</text>
<text class="node-body" x="677" y="324" text-anchor="middle" font-size="13">upserts its half of</text>
<text class="node-body" x="677" y="342" text-anchor="middle" font-size="13">the store-day row</text>
<rect class="main-node" x="832" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="923" y="300" text-anchor="middle" font-size="17">Background job</text>
<text class="node-body" x="923" y="324" text-anchor="middle" font-size="13">both halves in? then</text>
<text class="node-body" x="923" y="342" text-anchor="middle" font-size="13">CPLH and labor %</text>
<rect class="main-node" x="1077" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="1168" y="300" text-anchor="middle" font-size="17">Alert claim</text>
<text class="node-body" x="1168" y="324" text-anchor="middle" font-size="13">claimed once, by a</text>
<text class="node-body" x="1168" y="342" text-anchor="middle" font-size="13">conditional update</text>
<rect class="main-node" x="1323" y="250" width="181" height="124" rx="20"/>
<text class="node-title" x="1413" y="300" text-anchor="middle" font-size="17">Discord</text>
<text class="node-body" x="1413" y="324" text-anchor="middle" font-size="13">one alert per</text>
<text class="node-body" x="1413" y="342" text-anchor="middle" font-size="13">store and day</text>
<line class="arrow" x1="279" y1="312" x2="337" y2="312" marker-end="url(#head)"/>
<text class="label" x="309" y="302" text-anchor="middle">POST</text>
<line class="arrow" x1="525" y1="312" x2="583" y2="312" marker-end="url(#head)"/>
<text class="label" x="555" y="302" text-anchor="middle">upsert</text>
<line class="arrow" x1="770" y1="312" x2="828" y2="312" marker-end="url(#head)"/>
<text class="label" x="800" y="302" text-anchor="middle">read</text>
<line class="arrow" x1="1015" y1="312" x2="1073" y2="312" marker-end="url(#head)"/>
<text class="label" x="1045" y="302" text-anchor="middle">over 25%</text>
<line class="arrow" x1="1261" y1="312" x2="1319" y2="312" marker-end="url(#head)"/>
<text class="label" x="1291" y="302" text-anchor="middle">send</text>
<rect class="support-node" x="96" y="590" width="181" height="104" rx="20"/>
<text class="node-title" x="187" y="628" text-anchor="middle" font-size="14.5">mock_data_sender.py</text>
<text class="node-body" x="187" y="652" text-anchor="middle" font-size="13">sales, labor, then a</text>
<text class="node-body" x="187" y="670" text-anchor="middle" font-size="13">re-delivered labor</text>
<line class="up-arrow" x1="187" y1="586" x2="187" y2="378" marker-end="url(#head-sup)"/>
<text class="label" x="197" y="486" font-size="12">replays</text>
<rect class="support-node" x="341" y="590" width="181" height="104" rx="20"/>
<text class="node-title" x="432" y="630" text-anchor="middle" font-size="17">Pydantic models</text>
<text class="node-body" x="432" y="654" text-anchor="middle" font-size="13">bad dates, negatives,</text>
<text class="node-body" x="432" y="672" text-anchor="middle" font-size="13">odd store IDs: 422</text>
<line class="up-arrow" x1="432" y1="586" x2="432" y2="378" marker-end="url(#head-sup)"/>
<text class="label" x="442" y="486" font-size="12">validate</text>
<rect class="support-node" x="587" y="590" width="181" height="104" rx="20"/>
<text class="node-title" x="677" y="629" text-anchor="middle" font-size="16.0">Supabase Postgres</text>
<text class="node-body" x="677" y="653" text-anchor="middle" font-size="13">unique store-day, RLS;</text>
<text class="node-body" x="677" y="671" text-anchor="middle" font-size="13">or an in-memory store</text>
<line class="up-arrow" x1="677" y1="378" x2="677" y2="586" marker-end="url(#head-sup)"/>
<text class="label" x="687" y="486" font-size="12">PostgREST</text>
<rect class="support-node" x="1077" y="590" width="181" height="104" rx="20"/>
<text class="node-title" x="1168" y="628" text-anchor="middle" font-size="15.0">Release on failure</text>
<text class="node-body" x="1168" y="652" text-anchor="middle" font-size="13">Discord says no: the</text>
<text class="node-body" x="1168" y="670" text-anchor="middle" font-size="13">next webhook retries</text>
<line class="up-arrow" x1="1168" y1="586" x2="1168" y2="378" marker-end="url(#head-sup)"/>
<text class="label" x="1178" y="486" font-size="12">if send fails</text>
<text x="70" y="770"><tspan class="note-strong">Safe on re-delivery:</tspan><tspan class="note" dx="8">every write is an atomic upsert, and a re-sent webhook recomputes but never alerts twice.</tspan></text>
<text x="70" y="796"><tspan class="note-strong">Verified 2026-09-27:</tspan><tspan class="note" dx="8">local run with the real Discord webhook: waiting, alerted, then already_alerted on re-delivery.</tspan></text>
<text x="70" y="822"><tspan class="note-strong">Secrets:</tspan><tspan class="note" dx="8">WEBHOOK_SECRET, SUPABASE_URL + service-role key, ALERT_WEBHOOK_URL (.env).</tspan></text>
</svg>
